<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>for ms.beautiful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    #ffe66d 0%,
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 25%,
                    #ff9fbd 0%,
                    transparent 28%
                ),

                radial-gradient(
                    circle at 80% 85%,
                    #ffd85c 0%,
                    transparent 28%
                ),

                linear-gradient(
                    135deg,
                    #8f1738 0%,
                    #c92f55 30%,
                    #d94b69 50%,
                    #e8897b 72%,
                    #f3c45c 100%
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            position: relative;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: #ffd95a;

            filter: blur(150px);

            opacity: 0.25;

            top: -200px;
            left: -150px;

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background: #ff8eae;

            filter: blur(140px);

            opacity: 0.28;

            bottom: -200px;
            right: -150px;

            pointer-events: none;
        }


        /* =========================
           DECORATIVE CIRCLES
        ========================= */

        .circle {
            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            opacity: 0.35;
        }


        .circle-1 {
            width: 90px;
            height: 90px;

            border: 2px solid #ffe477;

            top: 10%;
            left: 8%;

            animation: float1 6s ease-in-out infinite;
        }


        .circle-2 {
            width: 55px;
            height: 55px;

            background: #ffabc1;

            top: 18%;
            right: 12%;

            animation: float2 5s ease-in-out infinite;
        }


        .circle-3 {
            width: 120px;
            height: 120px;

            border: 2px solid #ffd85c;

            bottom: 8%;
            left: 12%;

            animation: float1 7s ease-in-out infinite;
        }


        .circle-4 {
            width: 70px;
            height: 70px;

            background: #f58ca8;

            bottom: 15%;
            right: 8%;

            animation: float2 6s ease-in-out infinite;
        }


        /* =========================
           FLOATING DOTS
        ========================= */

        .dot {
            position: fixed;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ffe477;

            box-shadow:
                0 0 15px rgba(255, 228, 119, 0.8);

            pointer-events: none;

            animation: floatDot 5s ease-in-out infinite;
        }


        .dot-1 {
            top: 15%;
            left: 25%;
        }


        .dot-2 {
            top: 35%;
            right: 20%;

            width: 6px;
            height: 6px;

            animation-delay: 1s;
        }


        .dot-3 {
            bottom: 25%;
            left: 20%;

            width: 5px;
            height: 5px;

            animation-delay: 2s;
        }


        .dot-4 {
            bottom: 18%;
            right: 25%;

            width: 9px;
            height: 9px;

            animation-delay: 1.5s;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {
            width: 100%;
            max-width: 1050px;

            text-align: center;

            position: relative;

            z-index: 5;
        }


        /* =========================
           TITLE
        ========================= */

        .title {
            color: white;

            font-size: clamp(28px, 5vw, 52px);

            font-weight: 800;

            letter-spacing: 2px;

            margin-bottom: 10px;

            text-shadow:
                0 5px 20px rgba(80, 0, 30, 0.35);
        }


        .subtitle {
            color: rgba(255, 255, 255, 0.9);

            font-size: clamp(14px, 2vw, 18px);

            margin-bottom: 25px;

            letter-spacing: 1px;
        }


        /* =========================
           VIDEO CARD
        ========================= */

        .video-card {
            position: relative;

            padding: 10px;

            background:
                linear-gradient(
                    135deg,
                    #8f855d91,
                    #c9a2ab,
                    #d94b69
                );

            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(80, 0, 30, 0.4),
                0 0 40px rgba(255, 190, 120, 0.25);

            animation: cardAppear 1s ease;
        }


        /* =========================
           VIDEO
        ========================= */

        video {
            display: block;

            width: 100%;

            height: auto;

            max-height: 75vh;

            object-fit: contain;

            background: #000;

            border-radius: 17px;
        }


        /* =========================
           CAPTION
        ========================= */

        .caption {
            margin-top: 20px;

            color: rgba(255, 255, 255, 0.9);

            font-size: 15px;

            letter-spacing: 1px;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        @keyframes float1 {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }


        @keyframes float2 {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(15px) scale(1.08);
            }
        }


        @keyframes floatDot {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-25px);
                opacity: 0.9;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 25px 12px;
            }

            .title {
                font-size: 30px;
            }

            .subtitle {
                font-size: 14px;

                margin-bottom: 18px;
            }

            .video-card {
                padding: 6px;

                border-radius: 18px;
            }

            video {
                border-radius: 13px;

                max-height: 70vh;
            }

            .caption {
                font-size: 13px;
            }

            .circle-1 {
                width: 60px;
                height: 60px;
            }

            .circle-3 {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>


<body>

    <!-- Decorative background -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>

    <div class="dot dot-1"></div>
    <div class="dot dot-2"></div>
    <div class="dot dot-3"></div>
    <div class="dot dot-4"></div>


    <!-- Main website -->
    <main class="content">

        <h1 class="title">
            this song reminds me of you bruh
        </h1>

        <p class="subtitle">
           ok raman ug dili raka waman paman sad ka kaila nko hehe
           pero if ok raka hehe then why not BRUHH 

        </p>


        <div class="video-card">

            <video controls playsinline>
                <source src="video.mp4"= "video/mp4">
                Your browser does not support the video tag.
             
            </video>

        </div>


        <p class="caption">
            PLEASEEEEEEEEEEEEEEEEEEEEEEEE
        </p>

    </main>

</body>
</html>
